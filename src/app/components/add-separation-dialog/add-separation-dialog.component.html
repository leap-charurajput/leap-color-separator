<div *ngIf="isOpen" class="add-separation-modal-overlay" (click)="cancelDialog()">
 <div class="add-separation-modal" (click)="$event.stopPropagation()">
  <div class="add-separation-modal-title">Add separation</div>

  <div class="add-separation-modal-graphic">Graphic: <span>{{ graphicName }}</span></div>

  <div class="add-separation-modal-field">
   <div class="add-separation-modal-style-row">
    <div class="add-separation-modal-radio-cell">
     <app-radio name="add-separation-selection-mode" [checked]="selectionMode === 'style'"
      (change)="onModeChange('style')" label="Style Code"></app-radio>
    </div>
    <div class="add-separation-modal-input-wrap">
     <input type="text" [value]="selectionMode === 'style' ? (query || selectedStyleCode) : selectedStyleCode"
      (input)="onStyleInput($event)" placeholder="Type to search Styles.xlsx" class="add-separation-modal-input"
      [disabled]="isLoading || selectionMode !== 'style'" />
     <div *ngIf="selectionMode === 'style' && hasTypedQuery" class="add-separation-modal-list">
      <div *ngIf="isLoading" class="add-separation-modal-empty">Loading styles...</div>
      <div *ngIf="!isLoading && filteredStyles.length === 0" class="add-separation-modal-empty">
       No matching styles
      </div>
      <button *ngFor="let item of filteredStyles; let i = index" type="button" class="add-separation-modal-list-item"
       [class.is-selected]="item.styleCode === selectedStyleCode" (mousedown)="$event.preventDefault()"
       (click)="selectStyle(item.styleCode)">
       <span class="style-code">{{ item.styleCode }}</span>
       <span class="profile-name">{{ item.profileName || 'Unknown Profile' }}</span>
      </button>
     </div>
    </div>
   </div>
  </div>

  <div class="add-separation-modal-field">
   <div class="add-separation-modal-style-row">
    <div class="add-separation-modal-radio-cell">
     <app-radio name="add-separation-selection-mode" [checked]="selectionMode === 'profile'"
      (change)="onModeChange('profile')" label="Profile"></app-radio>
    </div>
    <div class="add-separation-modal-input-wrap">
     <input type="text" [value]="selectionMode === 'profile' ? (query || selectedProfileName) : selectedProfileDisplay"
      (input)="onProfileInput($event)" placeholder="Type to search Profiles" class="add-separation-modal-input"
      [disabled]="isLoading || selectionMode !== 'profile'" />
     <div *ngIf="selectionMode === 'profile' && hasTypedQuery" class="add-separation-modal-list">
      <div *ngIf="isLoading" class="add-separation-modal-empty">Loading profiles...</div>
      <div *ngIf="!isLoading && filteredProfiles.length === 0" class="add-separation-modal-empty">
       No matching profiles
      </div>
      <button *ngFor="let profileName of filteredProfiles; let i = index" type="button"
       class="add-separation-modal-list-item" [class.is-selected]="profileName === selectedProfileName"
       (mousedown)="$event.preventDefault()" (click)="selectProfile(profileName)">
       <span class="style-code">{{ profileName }}</span>
      </button>
     </div>
    </div>
   </div>
  </div>

  <div class="add-separation-modal-footer">
   <app-button variant="secondary" size="medium" (onClick)="cancelDialog()">Cancel</app-button>
   <app-button variant="primary" size="medium" [disabled]="!canSubmit" (onClick)="confirmDialog()">Add
    Separation</app-button>
  </div>
 </div>
</div>
