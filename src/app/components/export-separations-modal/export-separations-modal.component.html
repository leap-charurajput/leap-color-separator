<div *ngIf="isOpen" class="modal-overlay" (mousedown)="onOverlayClick($event)" (click)="onOverlayClick($event)">
	<div class="export-separations-modal modal-container" (mousedown)="onOverlayClick($event)" (click)="onOverlayClick($event)">
		<div class="modal-header">
			<h3 class="modal-title">Export Separations</h3>
		</div>

		<div class="modal-body">
			<div class="control-number-field">
				<label for="control-number" class="control-number-label">Control number</label>
				<input
					id="control-number"
					type="text"
					class="control-number-input"
					[value]="controlNumber"
					(input)="handleControlNumberChange($event)"
					placeholder="Enter control number"
					autocomplete="off"
				/>
			</div>

			<div class="control-number-field">
				<label for="version-number" class="control-number-label">Version number</label>
				<input
					id="version-number"
					type="text"
					class="control-number-input"
					[value]="versionNumber"
					(input)="handleVersionNumberChange($event)"
					placeholder="Enter version number"
					autocomplete="off"
				/>
			</div>

			<div class="export-options-list">
				<div class="export-option-item">
					<app-checkbox
						id="export-print-guide"
						[checked]="exportPrintGuide"
						[label]="'Export Print Guide'"
						(change)="handlePrintGuideChange($event)"
					></app-checkbox>
				</div>
				<div class="export-option-item">
					<app-checkbox
						id="export-postscript"
						[checked]="postscriptReady && exportPostscript"
						[disabled]="!postscriptReady"
						[label]="'Export Postscript and Seps Preview'"
						(change)="handlePostscriptChange($event)"
					></app-checkbox>
				</div>
				<div *ngIf="!postscriptReady && postscriptIssues?.length" class="export-postscript-readiness-note">
					<strong>PostScript export is unavailable:</strong>
					<ul>
						<li *ngFor="let issue of postscriptIssues">{{ issue.message }}</li>
					</ul>
				</div>
			</div>
		</div>

		<div class="modal-footer">
			<app-button variant="secondary" (click)="onCancel()">Cancel</app-button>
			<app-button variant="primary" [disabled]="!canExport" (click)="onExport()">Export</app-button>
		</div>
	</div>
</div>
