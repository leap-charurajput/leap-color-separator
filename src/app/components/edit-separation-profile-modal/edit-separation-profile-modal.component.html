<div *ngIf="isOpen" class="modal-overlay" (mousedown)="onOverlayInteraction($event)"
 (click)="onOverlayInteraction($event)">
 <div class="profile-modal-container" (mousedown)="onOverlayInteraction($event)" (click)="onOverlayInteraction($event)">
  <div class="modal-header">
   <h3 class="modal-title">Edit Separation Profile</h3>
  </div>

  <form (submit)="onSubmit($event)">
   <div class="modal-body settings-style">
    <!-- Profile information -->
    <div class="settings-field">
     <label class="settings-field-label">Name:</label>
     <input type="text" class="settings-field-input settings-field-input-wide" [value]="formState.name"
      (input)="onInputChange('name', $event)" />
    </div>
    <div class="settings-field">
     <label class="settings-field-label">Code:</label>
     <input type="text" class="settings-field-input settings-field-input-wide" [value]="formState.code"
      (input)="onInputChange('code', $event)" />
    </div>
    <div class="settings-field">
     <label class="settings-field-label">Color Mesh:</label>
     <input type="text" class="settings-field-input" [value]="formState.colorMesh"
      (input)="onInputChange('colorMesh', $event)" />
    </div>

    <!-- Ink properties -->
    <div class="settings-field">
     <app-checkbox [checked]="formState.waterbaseInk" [label]="'Waterbase Ink'"
      (change)="onCheckboxChange('waterbaseInk', $event)"></app-checkbox>
    </div>
    <div class="settings-field">
     <app-checkbox [checked]="formState.overprintAllInks" [label]="'Overprint all inks'"
      (change)="onCheckboxChange('overprintAllInks', $event)"></app-checkbox>
    </div>
    <div class="profile-modal-compact-rows">
     <div class="settings-field settings-field-inline">
      <app-checkbox [checked]="formState.blocker" [label]="'Blocker'"
       (change)="onCheckboxChange('blocker', $event)"></app-checkbox>
      <label class="settings-field-label-inline">Mesh</label>
      <input type="text" class="settings-field-input settings-field-input-mesh" [value]="formState.blockerMesh"
       (input)="onInputChange('blockerMesh', $event)" />
     </div>

     <!-- Underbase 1-4: Underbase 1 always checked and disabled -->
     <div *ngFor="let mesh of formState.underbaseMeshes; let i = index; trackBy: trackByIndex"
      class="settings-field settings-field-inline">
      <app-checkbox [checked]="formState.underbaseEnabled[i]" [label]="'Underbase ' + (i + 1)" [disabled]="i === 0"
       (change)="onUnderbaseEnabledChange(i, $event)"></app-checkbox>
      <label class="settings-field-label-inline">Mesh</label>
      <input type="text" class="settings-field-input settings-field-input-mesh" [value]="formState.underbaseMeshes[i]"
       (input)="onMeshChange(i, $event)" />
      <app-checkbox [checked]="formState.underbaseKnockoutBlack[i]" [label]="'k/o black inks'"
       [disabled]="!formState.underbaseEnabled[i]" (change)="onUnderbaseKnockoutChange(i, $event)"></app-checkbox>
     </div>
    </div>

    <!-- Format ink name label -->
    <div class="settings-field settings-field-inline">
     <app-checkbox [checked]="formState.formatInkNameLabel" [label]="'Format ink name label'"
      (change)="onCheckboxChange('formatInkNameLabel', $event)"></app-checkbox>
     <input type="text" class="settings-field-input settings-field-input-format"
      [value]="formState.colorNameLabelFormat" (input)="onInputChange('colorNameLabelFormat', $event)"
      placeholder="Color name label format" />
    </div>

    <!-- Black inks k/o'd (read-only): show only when any k/o black inks is checked -->
    <div *ngIf="isAnyKnockoutBlackChecked()" class="settings-field settings-field-vertical">
     <label class="settings-field-label">Black inks k/o'd:</label>
     <textarea class="settings-field-input settings-field-input-wide" [value]="formState.blackInksKnockoutDisplay"
      (input)="onInputChange('blackInksKnockoutDisplay', $event)"></textarea>
    </div>
   </div>

   <div class="modal-footer">
    <app-button type="button" variant="secondary" (click)="onCancel()">Cancel</app-button>
    <app-button type="button" variant="primary" (click)="onSubmit($event)">OK</app-button>
   </div>
  </form>
 </div>
</div>
